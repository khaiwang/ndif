services:
  ray:
    environment:
      # Sequential: actor max_concurrency=1 means one __call__ at a time;
      # VanillaBatchServer cannot fuse requests even if several arrive
      # concurrently at the client side.
      - NDIF_MAX_CONCURRENCY=1
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['0']
              capabilities: [ gpu ]
